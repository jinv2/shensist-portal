<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TianSuan Matrix | ShenSiST</title>
    <style>
        :root { --bg-color: #050505; --card-bg: #111; --text-main: #ffffff; --accent: #00f0ff; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; }
        
        .header { display: flex; align-items: center; justify-content: space-between; padding: 20px 0 40px; max-width: 1200px; margin: 0 auto; }
        .back-btn { color: #888; text-decoration: none; font-size: 0.9rem; transition: 0.3s; display: flex; align-items: center; gap: 5px; }
        .back-btn:hover { color: #fff; }
        .page-title { font-size: 1.5rem; font-weight: 700; letter-spacing: -1px; }

        /* 自动网格布局 */
        #app-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .app-card {
            background: var(--card-bg);
            border: 1px solid #222;
            border-radius: 16px;
            padding: 25px 20px;
            text-align: center;
            text-decoration: none;
            color: #fff;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
        }

        .app-card:hover { transform: translateY(-5px); border-color: var(--accent); background: #1a1a1a; }
        .app-icon { font-size: 3rem; margin-bottom: 15px; }
        .app-name { font-size: 1.1rem; font-weight: 600; margin-bottom: 8px; color: #fff; }
        .app-desc { font-size: 0.8rem; color: #666; line-height: 1.4; }
        .footer { text-align: center; margin-top: 50px; color: #444; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="header">
        <a href="/" class="back-btn">← Back to Portal</a>
        <div class="page-title">Matrix App Store</div>
        <div style="width: 100px;"></div>
    </div>

    <div id="app-container"></div>

    <div class="footer">© 2026 ShenSiST System Matrix</div>

    <script src="db.js"></script>
    <script>
        const container = document.getElementById('app-container');
        if (typeof appDatabase !== 'undefined' && Array.isArray(appDatabase)) {
            appDatabase.forEach(app => {
                const card = document.createElement('a');
                card.href = app.url;
                card.className = 'app-card';
                card.target = "_blank"; 
                card.innerHTML = `
                    <div class="app-icon">${app.icon}</div>
                    <div class="app-name">${app.name}</div>
                    <div class="app-desc">${app.desc}</div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
